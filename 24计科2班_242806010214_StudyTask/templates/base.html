<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}任务列表{% endblock %} · StudyTask</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="{{ url_for('index') }}">StudyTask 学习任务管理</a>
      <nav>
        <a href="{{ url_for('index') }}">任务列表</a>
        <a class="btn btn-primary" href="{{ url_for('new_task') }}">新建任务</a>
      </nav>
    </div>
  </header>
  <main class="wrap">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <div class="wrap">软件工程实验一 · StudyTask · 单用户本地应用</div>
  </footer>
</body>
</html>
